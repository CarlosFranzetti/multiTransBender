name: Build plugin

# Produces the binaries the download page links to: VST3 and a desktop
# standalone on every platform, plus the Audio Unit on macOS. AU and the Windows
# binaries can only be produced on their own operating systems, so this workflow
# is the only way they exist — a Linux dev box cannot make them.

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS (universal — VST3, AU, Standalone)
            artifact: macOS
          - os: windows-2022
            name: Windows (VST3, Standalone)
            artifact: Windows
          - os: ubuntu-22.04
            name: Linux (VST3, Standalone)
            artifact: Linux

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev \
            mesa-common-dev ninja-build xvfb

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: plugin/build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('plugin/CMakeLists.txt') }}

      - name: Configure
        working-directory: plugin
        shell: bash
        # Universal binary on macOS so one download covers Apple Silicon and Intel.
        # The architecture list has to stay quoted: an unquoted semicolon is a
        # shell command separator, which truncates the command mid-flight.
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        working-directory: plugin
        run: cmake --build build --config Release --parallel 4

      - name: Run the compiled-plugin smoke test
        working-directory: plugin
        shell: bash
        # The test drives the real AudioProcessor, so a green run means the
        # binary being packaged actually processes audio correctly.
        run: |
          BIN=$(find build -name "multiTransBenderTests*" -type f -perm -u+x | head -1)
          if [ -z "$BIN" ]; then echo "test binary not found"; exit 1; fi
          if [ "${{ runner.os }}" = "Linux" ]; then xvfb-run -a "$BIN"; else "$BIN"; fi

      - name: Collect artefacts
        shell: bash
        run: |
          mkdir -p dist
          SRC="plugin/build/multiTransBender_artefacts/Release"
          [ -d "$SRC" ] || SRC="plugin/build/multiTransBender_artefacts"
          for fmt in VST3 AU Standalone; do
            if [ -d "$SRC/$fmt" ]; then
              mkdir -p "dist/$fmt"
              cp -R "$SRC/$fmt/." "dist/$fmt/"
            fi
          done
          cp LICENSE dist/ 2>/dev/null || true
          cp docs/INSTALL.md dist/ 2>/dev/null || true
          ls -laR dist

      - uses: actions/upload-artifact@v4
        with:
          name: multiTransBender-${{ matrix.artifact }}
          path: dist
          if-no-files-found: error

  package:
    name: Package release bundle
    needs: build
    runs-on: ubuntu-22.04
    # Publishing a release writes to the repository, which the default token is
    # not granted unless it is asked for explicitly.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: staging

      - name: Build the download bundle
        run: |
          mkdir -p bundle
          for d in staging/*/; do
            platform=$(basename "$d" | sed 's/multiTransBender-//')
            mkdir -p "bundle/$platform"
            cp -R "$d." "bundle/$platform/"
          done
          cp docs/INSTALL.md bundle/ 2>/dev/null || true
          cp LICENSE bundle/
          cd bundle && zip -r -9 ../multiTransBender-plugins.zip . && cd ..
          ls -la multiTransBender-plugins.zip

      - uses: actions/upload-artifact@v4
        with:
          name: multiTransBender-plugins
          path: multiTransBender-plugins.zip
          if-no-files-found: error

      # A tag cuts a real versioned release. Pushes to the development branch
      # refresh a single rolling pre-release instead, so the download button on
      # the site always resolves to something rather than an empty releases page.
      - name: Publish rolling beta
        if: github.ref == 'refs/heads/claude/multitransbender-web-deploy-sue1ue'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-beta
          name: Latest beta build
          prerelease: true
          files: multiTransBender-plugins.zip
          body: |
            Rolling build from the development branch — replaced on every push.
            For a stable download, use a versioned release.

            - **macOS** universal (Apple Silicon + Intel): VST3, Audio Unit, Standalone
            - **Windows** x64: VST3, Standalone
            - **Linux** x64: VST3, Standalone

            Unsigned. See INSTALL.md for how to get past Gatekeeper and SmartScreen.

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: multiTransBender-plugins.zip
          body: |
            Compiled TRANSBAND — multiTransBender plugins.

            - **macOS** universal (Apple Silicon + Intel): VST3, Audio Unit, Standalone
            - **Windows** x64: VST3, Standalone
            - **Linux** x64: VST3, Standalone

            Unsigned. See INSTALL.md for how to get past Gatekeeper and SmartScreen.
